server {
    listen 80;
    listen [::]:80;
    server_name fatoushop.multibrain.cloud;

    root /var/www/fatou-shop/current/dist;
    index index.html;
    client_max_body_size 8m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fatou-shop/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    include /etc/nginx/snippets/fatoushop-locations.conf;
}
