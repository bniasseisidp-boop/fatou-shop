server {
    listen 80;
    listen [::]:80;
    server_name fatoushop.multibrain.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/fatou-shop/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fatoushop.multibrain.cloud;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/fatou-shop/current/dist;
    index index.html;
    client_max_body_size 8m;

    ssl_certificate /etc/letsencrypt/live/fatoushop.multibrain.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fatoushop.multibrain.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/fatoushop-locations.conf;
}
