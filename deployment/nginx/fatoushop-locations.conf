add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=(self)" always;

location = /service-worker.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

location = /manifest.webmanifest {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

location = /index.html {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}

location ^~ /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
}

location ^~ /storage/ {
    alias /var/www/fatou-shop/current/backend/public/storage/;
    autoindex off;
}

location ^~ /api {
    try_files $uri @laravel;
}

location = /up {
    try_files $uri @laravel;
}

location @laravel {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root/../backend/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_URI /index.php;
    fastcgi_param DOCUMENT_ROOT $realpath_root/../backend/public;
    fastcgi_param PATH_INFO "";
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    fastcgi_hide_header X-Powered-By;
}

location ~ /\.(?!well-known).* {
    deny all;
}

location ~* \.php(?:$|/) {
    return 404;
}

location / {
    try_files $uri $uri/ /index.html;
}
